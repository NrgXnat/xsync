# Configuration for Xsync UI

projectResources:
    kind: panel.element
    label: Project Resources
    contents:
        syncType:
            kind: select.menu
            name: project_resources[sync_type]
            id: project-resources-sync-type
            options:
                all: All
                none: None
                include: Include
                exclude: Exclude
        resourceList:
            kind: list.input.text
            name: project_resources[resource_list][0]

subjectResources:
    kind: panel.element
    label: Subject Resources
    contents:
        syncType:
            kind: select.menu
            name: subject_resources[sync_type]
            id: project-resources-sync-type
            options:
                all: All
                none: None
                include: Include
                exclude: Exclude
        resourceList:
            tag: div#subject-resource-list
            contents:
                # define an input to use as a template
                resource:
                    kind: input.text.block
                    name: subject_resources[resource_list][0]
#                    name2: imaging_sessions[advanced_options][0][session_assessors][advanced_options][0]
                    data:
                        index: 0
        addSubjectResourceButton:
            tag: button.add-resource
            element:
                html: Add Subject Resource
                data:
                    resourceList: "#subject-resource-list"
                    resourceType: subject_resources[resource_list]

subjectAssessors:
    kind: panel.element
    label: Subject Assessors
    contents:
        xsiTypes:
            kind: select.menu
            name: subject_assessors[xsi_types][sync_type]
            id: subject-assessors-sync-type
            options:
                all: All
                none: None
                include: Include
                exclude: Exclude
        resourceList:
            tag: div#subject-assessor-types
            contents:
                # this text input will be the template for additional inputs
                resource:
                    kind: input.text.block
                    name: subject_assessors[xsi_types][types_list][0]
                    data:
                        index: 0
        addSubjectAssessorsButton:
            tag: button.add-resource
            element:
                html: Add Subject Assessor
                data:
                    resourceList: "#subject-assessor-types"
                    resourceType: subject_assessors[xsi_types][types_list]

config:
    kind: panel.form
    label: Xsync Configuration
    contents:
        ${projectResources}
        ${subjectResources}
        ${subjectAssessors}
