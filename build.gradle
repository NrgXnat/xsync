    compile group: 'com.google.collections', name: 'google-collections', version:'1.0'
    compile group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version:'2.2.3'
    compile group: 'org.apache.axis', name: 'axis', version:'1.4'
    compile group: 'javax.servlet', name: 'servlet-api', version:'2.5'
    compile group: 'org.codehaus.jackson', name: 'jackson-mapper-asl', version:'1.8.5'
    compile group: 'dcm4che', name: 'dcm4che-core', version:'2.0.25'
